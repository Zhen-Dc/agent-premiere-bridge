<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Agent Premiere Bridge</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/CSInterface.js"></script>
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>Agent Bridge</h1>
        <span id="state" class="pill">Idle</span>
      </header>

      <section class="settings">
        <label>
          Server
          <input id="serverUrl" value="http://127.0.0.1:41326">
        </label>
      </section>

      <section>
        <div class="section-title">
          <h2>Status</h2>
        </div>
        <article id="currentJob" class="job empty">
          <p>Connecting to bridge.</p>
        </article>
      </section>

      <section>
        <div class="section-title">
          <h2>History</h2>
        </div>
        <pre id="log"></pre>
      </section>
    </main>

    <script src="./js/main.js"></script>
  </body>
</html>
